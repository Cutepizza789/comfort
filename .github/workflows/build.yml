name: Build ComfortQuest

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # No Gradle wrapper is committed, so install a Gradle version that matches AGP 8.5.
      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.7'

      - name: Build settings app (debug APK)
        run: gradle :app:assembleDebug --stacktrace --console=plain

      - name: Build OpenXR proxy library (arm64)
        run: |
          export ANDROID_NDK_HOME="${ANDROID_NDK_HOME:-$ANDROID_NDK_LATEST_HOME}"
          echo "Using NDK at $ANDROID_NDK_HOME"
          chmod +x proxy/build.sh
          proxy/build.sh

      - name: Collect outputs
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/ComfortQuest.apk
          cp proxy/out/libopenxr_loader.so dist/
          cp comfort.py patch_apk.py README.md dist/

      - uses: actions/upload-artifact@v4
        with:
          name: ComfortQuest
          path: dist/*

      - name: Publish release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
